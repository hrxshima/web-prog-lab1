<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>КрутоМаркет - Интернет-магазин</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>    
<body>
    <header class="header">
        <div class="container header__container">
            <div class="logo-wrapper">
                <a href="#" class="logo">
                  <svg class="logo__icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M11 1h2v3h-2V1zm-2 1h1v1H9V2zm5 0h1v1h-1V2z" />
                    <path d="M6 5h12v7H6V5z" fill="currentColor" />
                    <path d="M8 7h2v2H8V7zm6 0h2v2h-2V7z" fill="#0a0339" />
                    <path d="M10 12h4v1h-4v-1z" />
                    <path d="M5 13h14v7H5v-7zm-2 1h1v5H3v-5zm17 0h1v5h-1v-5z" />
                    <path d="M11 15h2v2h-2v-2z" fill="#eb2574" />
                    <path d="M7 20h3v3H7v-3zm7 0h3v3h-3v-3z" />
                  </svg>
                  <span>КрутоМаркет</span>
                </a>
                <span class="logo__subtitle">интернет-магазин техники</span>
            </div>
            <button class="cart-trigger" id="cart-toggle-btn" type="button" aria-label="Открыть корзину">
                Корзина (<span id="cart-count">0</span>)
            </button>
        </div>   
    </header>         

    <main class="container main-layout">
        <section class="catalog" aria-labelledby="catalog-title">
            <h1 id="catalog-title" class="section-title">Каталог товаров</h1>
        <!-- Контейнер для карточек (будут рендериться через JS) -->
            <div class="catalog__grid" id="catalog-list">
        <!-- Карточки товаров появятся здесь -->
            </div>
        </section>
        
        <!-- Боковая панель корзины -->
        <aside class="cart" id="cart-panel" aria-labelledby="cart-title">
            <h2 id="cart-title" class="cart__title">Корзина</h2>

            <div class="cart__items" id="cart-items">
                <p class="cart__empty">Корзина пуста</p>
            </div>

            <div class="cart__footer">
                <div class="cart__total">
                    Итого: <strong id="cart-total-price">0 ₽</strong>
                </div>
                <button id="checkout-btn" class="btn btn--primary" type="button" disabled>
                    Оформить заказ
                </button>
            </div>
        </aside>    
    </main>  
    
    <!-- Модальное окно оформления заказа -->
    <dialog id="order-modal" class="modal">
        <div class="modal__content">
            <div class="modal__header">
                <h2 class="modal__title">Оформление заказа</h2>
                <button type="button" class="modal__close" id="close-modal-btn" aria-label="Закрыть">&times;</button>
            </div>

            <form id="order-form" class="order-form" novalidate>
                <div class="form-group">
                    <label for="first-name">Имя *</label>
                    <input type="text" id="first-name" name="firstName" required placeholder="Иван" />
                </div>

                <div class="form-group">
                    <label for="last-name">Фамилия *</label>
                    <input type="text" id="last-name" name="lastName" required placeholder="Иванов" />
                </div>

                <div class="form-group">
                    <label for="phone">Контактный номер телефона *</label>
                    <input type="tel" id="phone" name="phone" required placeholder="+7 (999) 000-00-00" />
                </div>

                <div class="form-group">
                    <label for="address">Адрес доставки *</label>
                    <textarea id="address" name="address" rows="3" required placeholder="г. Москва, ул. Примерная, д. 1, кв. 10"></textarea>
                  </div>

                <button type="submit" class="btn btn--primary btn--full">Создать заказ</button>
            </form>

            <div id="order-success-msg" class="order-success" hidden>
                Заказ создан!🎉
            </div>
        </div>
    </dialog>
    
    <footer class="footer">
        <div class="container footer__container">
            <p>&copy; 2026 КрутоМаркет. Все права защищены.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>    
</html>
